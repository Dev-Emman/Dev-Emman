<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Emmanuel Olota</title>
  <desc id="d">Computing Science student at Ulster University, learning cybersecurity, seeking a 2027 placement</desc>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sweep { animation: sweep 7.2s step-end infinite; }
    @keyframes sweep {
      0%     { transform: translateY(0); }
      16.66% { transform: translateY(30px); }
      33.33% { transform: translateY(60px); }
      50%    { transform: translateY(90px); }
      66.66% { transform: translateY(120px); }
      83.33% { transform: translateY(150px); }
      100%   { transform: translateY(150px); }
    }
    @media (prefers-reduced-motion: reduce) { .sweep { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#16263F"/>
    </linearGradient>
    <clipPath id="panel"><rect x="620" y="40" width="540" height="240" rx="8"/></clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- left: identity -->
  <text class="sans" x="60" y="140" font-size="58" font-weight="700" fill="#E8F0FA" letter-spacing="-1">Emmanuel Olota</text>
  <rect x="62" y="162" width="64" height="4" rx="2" fill="#FFB347"/>
  <text class="sans" x="60" y="206" font-size="22" fill="#A9BCD3">Computing Science student, Ulster University</text>
  <text class="sans" x="60" y="238" font-size="22" fill="#A9BCD3">Learning cybersecurity, Belfast</text>
  <text class="mono" x="60" y="276" font-size="17" fill="#FFB347">Seeking a 2027 placement</text>

  <!-- right: packet list -->
  <rect x="620" y="40" width="540" height="240" rx="8" fill="#0B1424" stroke="#2A3F5F" stroke-width="1.5"/>
  <g clip-path="url(#panel)">
    <rect x="620" y="40" width="540" height="32" fill="#1B2D48"/>
    <g class="mono" font-size="13" fill="#7F96B5">
      <text x="636" y="61">No.</text>
      <text x="680" y="61">Source</text>
      <text x="780" y="61">Destination</text>
      <text x="890" y="61">Proto</text>
      <text x="960" y="61">Info</text>
    </g>

    <!-- sweeping highlight (the one moving element) -->
    <g class="sweep">
      <rect x="620" y="88" width="540" height="28" fill="#FFB347" fill-opacity="0.16"/>
      <rect x="620" y="88" width="4" height="28" fill="#FFB347"/>
    </g>

    <g class="mono" font-size="13" fill="#C9D8EA">
      <text x="636" y="107">1</text><text x="680" y="107">10.0.0.12</text><text x="780" y="107">10.0.0.1</text><text x="890" y="107">DNS</text><text x="960" y="107">Standard query A</text>

      <text x="636" y="137">2</text><text x="680" y="137">10.0.0.12</text><text x="780" y="137">93.184.216.34</text><text x="890" y="137">TCP</text><text x="960" y="137">[SYN] Seq=0</text>

      <text x="636" y="167">3</text><text x="680" y="167">93.184.216.34</text><text x="780" y="167">10.0.0.12</text><text x="890" y="167">TCP</text><text x="960" y="167">[SYN, ACK]</text>

      <text x="636" y="197">4</text><text x="680" y="197">10.0.0.12</text><text x="780" y="197">93.184.216.34</text><text x="890" y="197">TLSv1.3</text><text x="960" y="197">Client Hello</text>

      <text x="636" y="227">5</text><text x="680" y="227">93.184.216.34</text><text x="780" y="227">10.0.0.12</text><text x="890" y="227">TLSv1.3</text><text x="960" y="227">Server Hello</text>

      <text x="636" y="257">6</text><text x="680" y="257">10.0.0.12</text><text x="780" y="257">93.184.216.34</text><text x="890" y="257">HTTP</text><text x="960" y="257">GET / HTTP/1.1</text>
    </g>
  </g>
</svg>
